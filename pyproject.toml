[project]
name = "SM-DevSecOps"
version = "2.0.0"
description = "安全研发平台：扫描任务、漏洞闭环、安全策略与 SBOM"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
